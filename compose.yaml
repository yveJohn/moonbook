name: ${COMPOSE_PROJECT_NAME:-moonbook}

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:17.6-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-15432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks:
      - backend

  redis:
    image: ${REDIS_IMAGE:-redis:7.4.5-alpine}
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-16379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    networks:
      - backend

  minio:
    image: ${MINIO_IMAGE:-minio/minio:RELEASE.2025-07-23T15-54-02Z}
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    ports:
      - "127.0.0.1:${MINIO_API_HOST_PORT:-19000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_HOST_PORT:-19001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks:
      - backend

  minio-init:
    image: ${MINIO_MC_IMAGE:-minio/mc:RELEASE.2025-07-21T05-28-08Z}
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      MINIO_BUCKET: ${MINIO_BUCKET:-moonbook-content}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing "local/$${MINIO_BUCKET}"
        mc anonymous set none "local/$${MINIO_BUCKET}"
    networks:
      - backend

  migrate:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: ${MOONBOOK_SERVER_IMAGE:-moonbook/server:local}
    restart: "no"
    command: ["moonbook-migrate", "up"]
    environment: &server-environment
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      MINIO_BUCKET: ${MINIO_BUCKET:-moonbook-content}
      MOONBOOK_JWT_SIGNING_KEY: ${MOONBOOK_JWT_SIGNING_KEY:?MOONBOOK_JWT_SIGNING_KEY is required}
      MOONBOOK_METRICS_TOKEN: ${MOONBOOK_METRICS_TOKEN:?MOONBOOK_METRICS_TOKEN is required}
      MOONBOOK_SERVER_PORT: "8888"
      MOONBOOK_POSTGRES_HOST: postgres
      MOONBOOK_POSTGRES_PORT: "5432"
      MOONBOOK_REDIS_ADDR: redis:6379
      MOONBOOK_MINIO_ENDPOINT: minio:9000
      MOONBOOK_MINIO_BUCKET_URL: http://minio:9000/${MINIO_BUCKET:-moonbook-content}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

  admin-bootstrap:
    image: ${MOONBOOK_SERVER_IMAGE:-moonbook/server:local}
    restart: "no"
    command: ["moonbook-admin", "bootstrap"]
    profiles: ["bootstrap"]
    environment:
      <<: *server-environment
      MOONBOOK_ADMIN_USERNAME: ${MOONBOOK_ADMIN_USERNAME:-}
      MOONBOOK_ADMIN_PASSWORD: ${MOONBOOK_ADMIN_PASSWORD:-}
      MOONBOOK_ADMIN_NICKNAME: ${MOONBOOK_ADMIN_NICKNAME:-Moonbook Admin}
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - backend

  server:
    image: ${MOONBOOK_SERVER_IMAGE:-moonbook/server:local}
    restart: unless-stopped
    command: ["moonbook-server", "-c", "/run/moonbook/config.yaml"]
    environment: *server-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    expose:
      - "8888"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8888/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s
    stop_grace_period: 15s
    networks:
      - backend

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    image: ${MOONBOOK_WEB_IMAGE:-moonbook/web:local}
    restart: unless-stopped
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks:
      - frontend

  reader-ui:
    build:
      context: .
      dockerfile: deploy/compose/reader-ui.Dockerfile
    image: ${MOONBOOK_READER_IMAGE:-moonbook/reader-ui:local}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      READER_API_ORIGIN: http://server:8888
    depends_on:
      server:
        condition: service_healthy
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    stop_grace_period: 15s
    networks:
      - backend
      - frontend

  gateway:
    image: ${NGINX_IMAGE:-nginx:1.28.0-alpine3.21}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MOONBOOK_ADMIN_HOST_PORT:-18080}:8080"
      - "127.0.0.1:${MOONBOOK_READER_HOST_PORT:-18081}:8081"
    volumes:
      - ./deploy/compose/gateway.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      server:
        condition: service_healthy
      web:
        condition: service_healthy
      reader-ui:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/gateway-health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks:
      - backend
      - frontend

networks:
  backend:
    name: ${COMPOSE_PROJECT_NAME:-moonbook}_backend
  frontend:
    name: ${COMPOSE_PROJECT_NAME:-moonbook}_frontend

volumes:
  postgres_data:
    name: ${COMPOSE_PROJECT_NAME:-moonbook}_postgres_data
  redis_data:
    name: ${COMPOSE_PROJECT_NAME:-moonbook}_redis_data
  minio_data:
    name: ${COMPOSE_PROJECT_NAME:-moonbook}_minio_data
