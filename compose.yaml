name: ${COMPOSE_PROJECT_NAME:-moonbook}

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:17.6-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-15432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks:
      - backend

  redis:
    image: ${REDIS_IMAGE:-redis:7.4.5-alpine}
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-16379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    networks:
      - backend

  minio:
    image: ${MINIO_IMAGE:-minio/minio:RELEASE.2025-07-23T15-54-02Z}
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      MINIO_PROMETHEUS_AUTH_TYPE: public
    ports:
      - "127.0.0.1:${MINIO_API_HOST_PORT:-19000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_HOST_PORT:-19001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks:
      - backend

  minio-init:
    image: ${MINIO_MC_IMAGE:-minio/mc:RELEASE.2025-07-21T05-28-08Z}
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      MINIO_BUCKET: ${MINIO_BUCKET:-moonbook-content}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing "local/$${MINIO_BUCKET}"
        mc anonymous set none "local/$${MINIO_BUCKET}"
    networks:
      - backend

  migrate:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: ${MOONBOOK_SERVER_IMAGE:-moonbook/server:local}
    restart: "no"
    command: ["moonbook-migrate", "up"]
    environment: &server-environment
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      MINIO_BUCKET: ${MINIO_BUCKET:-moonbook-content}
      MOONBOOK_JWT_SIGNING_KEY: ${MOONBOOK_JWT_SIGNING_KEY:?MOONBOOK_JWT_SIGNING_KEY is required}
      MOONBOOK_METRICS_TOKEN: ${MOONBOOK_METRICS_TOKEN:?MOONBOOK_METRICS_TOKEN is required}
      MOONBOOK_SERVER_PORT: "8888"
      MOONBOOK_POSTGRES_HOST: postgres
      MOONBOOK_POSTGRES_PORT: "5432"
      MOONBOOK_REDIS_ADDR: redis:6379
      MOONBOOK_MINIO_ENDPOINT: minio:9000
      MOONBOOK_MINIO_BUCKET_URL: http://minio:9000/${MINIO_BUCKET:-moonbook-content}
      MOONBOOK_ADMIN_ORIGIN: ${MOONBOOK_ADMIN_ORIGIN:-http://localhost:8080}
      MOONBOOK_READER_ORIGIN: ${MOONBOOK_READER_ORIGIN:-http://localhost:8081}
      MOONBOOK_EPUSDT_PID: ${MOONBOOK_EPUSDT_PID:-}
      MOONBOOK_EPUSDT_SECRET: ${MOONBOOK_EPUSDT_SECRET:-}
      MOONBOOK_EPUSDT_CREDENTIAL_REF: ${MOONBOOK_EPUSDT_CREDENTIAL_REF:-primary}
      MOONBOOK_EPUSDT_VERIFY_CREDENTIALS_JSON: "${MOONBOOK_EPUSDT_VERIFY_CREDENTIALS_JSON:-[]}"
      MOONBOOK_EPUSDT_CREATE_URL: ${MOONBOOK_EPUSDT_CREATE_URL:-}
      MOONBOOK_EPUSDT_NOTIFY_URL: ${MOONBOOK_EPUSDT_NOTIFY_URL:-}
      MOONBOOK_EPUSDT_REDIRECT_URL: ${MOONBOOK_EPUSDT_REDIRECT_URL:-}
      MOONBOOK_EPUSDT_CONNECT_TIMEOUT_MS: ${MOONBOOK_EPUSDT_CONNECT_TIMEOUT_MS:-3000}
      MOONBOOK_EPUSDT_REQUEST_TIMEOUT_MS: ${MOONBOOK_EPUSDT_REQUEST_TIMEOUT_MS:-10000}
      MOONBOOK_EPUSDT_UNKNOWN_RELEASE_MINUTES: ${MOONBOOK_EPUSDT_UNKNOWN_RELEASE_MINUTES:-15}
      MOONBOOK_EPUSDT_CALLBACK_STALE_MINUTES: ${MOONBOOK_EPUSDT_CALLBACK_STALE_MINUTES:-5}
      MOONBOOK_EPUSDT_HEALTH_URL: ${MOONBOOK_EPUSDT_HEALTH_URL:-}
      MOONBOOK_EPUSDT_SYNC_URL: ${MOONBOOK_EPUSDT_SYNC_URL:-}
      MOONBOOK_AI_EXAMPLE_API_KEY: ${MOONBOOK_AI_EXAMPLE_API_KEY:-}
      MOONBOOK_FORUM_COOKIE_EXAMPLE: ${MOONBOOK_FORUM_COOKIE_EXAMPLE:-}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

  admin-bootstrap:
    image: ${MOONBOOK_SERVER_IMAGE:-moonbook/server:local}
    restart: "no"
    command: ["moonbook-admin", "bootstrap"]
    profiles: ["bootstrap"]
    environment:
      <<: *server-environment
      MOONBOOK_ADMIN_USERNAME: ${MOONBOOK_ADMIN_USERNAME:-}
      MOONBOOK_ADMIN_PASSWORD: ${MOONBOOK_ADMIN_PASSWORD:-}
      MOONBOOK_ADMIN_NICKNAME: ${MOONBOOK_ADMIN_NICKNAME:-Moonbook Admin}
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - backend

  server:
    image: ${MOONBOOK_SERVER_IMAGE:-moonbook/server:local}
    restart: unless-stopped
    command: ["moonbook-server", "-c", "/run/moonbook/config.yaml"]
    environment: *server-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    expose:
      - "8888"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8888/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s
    stop_grace_period: 15s
    networks:
      - backend

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    image: ${MOONBOOK_WEB_IMAGE:-moonbook/web:local}
    restart: unless-stopped
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks:
      - frontend

  reader-ui:
    build:
      context: .
      dockerfile: deploy/compose/reader-ui.Dockerfile
      args:
        VITE_READER_API_BASE: ${VITE_READER_API_BASE:-/prod-api}
    image: ${MOONBOOK_READER_IMAGE:-moonbook/reader-ui:local}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      READER_API_ORIGIN: http://server:8888
    depends_on:
      server:
        condition: service_healthy
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    stop_grace_period: 15s
    networks:
      - backend
      - frontend

  gateway:
    image: ${NGINX_IMAGE:-nginx:1.28.0-alpine3.21}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MOONBOOK_ADMIN_HOST_PORT:-18080}:8080"
      - "127.0.0.1:${MOONBOOK_READER_HOST_PORT:-18081}:8081"
    volumes:
      - ./deploy/compose/gateway.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      server:
        condition: service_healthy
      web:
        condition: service_healthy
      reader-ui:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/gateway-health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks:
      - backend
      - frontend

  monitoring-postgres-init:
    image: ${POSTGRES_IMAGE:-postgres:17.6-alpine}
    profiles: ["monitoring"]
    restart: "no"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_EXPORTER_PASSWORD: ${POSTGRES_EXPORTER_PASSWORD:-monitoring_not_configured}
    volumes:
      - ./deploy/monitoring/postgres-init.sh:/usr/local/bin/moonbook-monitoring-postgres-init:ro
    command: ["/usr/local/bin/moonbook-monitoring-postgres-init"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

  postgres-exporter:
    image: ${POSTGRES_EXPORTER_IMAGE:-prometheuscommunity/postgres-exporter:v0.17.1@sha256:38606faa38c54787525fb0ff2fd6b41b4cfb75d455c1df294927c5f611699b17}
    profiles: ["monitoring"]
    restart: unless-stopped
    environment:
      DATA_SOURCE_URI: postgres:5432/${POSTGRES_DB}?sslmode=disable
      DATA_SOURCE_USER: moonbook_monitor
      DATA_SOURCE_PASS: ${POSTGRES_EXPORTER_PASSWORD:-monitoring_not_configured}
    depends_on:
      monitoring-postgres-init:
        condition: service_completed_successfully
    networks:
      - backend
      - monitoring

  redis-exporter:
    image: ${REDIS_EXPORTER_IMAGE:-oliver006/redis_exporter:v1.74.0@sha256:88862b6fc5004ead3495c16d5ba548b14e898fe6d22e7c5b93bf3df83823a9a5}
    profiles: ["monitoring"]
    restart: unless-stopped
    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - backend
      - monitoring

  blackbox-exporter:
    image: ${BLACKBOX_EXPORTER_IMAGE:-prom/blackbox-exporter:v0.27.0@sha256:a50c4c0eda297baa1678cd4dc4712a67fdea713b832d43ce7fcc5f9bea05094d}
    profiles: ["monitoring"]
    restart: unless-stopped
    command: ["--config.file=/etc/blackbox_exporter/config.yml"]
    volumes:
      - ./deploy/monitoring/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    networks:
      - backend
      - frontend
      - monitoring

  cadvisor:
    image: ${CADVISOR_IMAGE:-gcr.io/cadvisor/cadvisor:v0.52.1@sha256:f40e65878e25c2e78ea037f73a449527a0fb994e303dc3e34cb6b187b4b91435}
    profiles: ["monitoring"]
    restart: unless-stopped
    privileged: false
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    networks:
      - monitoring

  monitoring-webhook:
    build:
      context: ./deploy/monitoring/webhook
      dockerfile: Dockerfile
    image: ${MONITORING_WEBHOOK_IMAGE:-moonbook/monitoring-webhook:local}
    profiles: ["monitoring"]
    restart: unless-stopped
    environment:
      MONITORING_WEBHOOK_FORWARD_URL: ${MONITORING_WEBHOOK_FORWARD_URL:-}
      MONITORING_WEBHOOK_FORWARD_TOKEN: ${MONITORING_WEBHOOK_FORWARD_TOKEN:-}
    ports:
      - "127.0.0.1:${MONITORING_WEBHOOK_HOST_PORT:-19094}:8080"
    networks:
      - monitoring

  alertmanager:
    image: ${ALERTMANAGER_IMAGE:-prom/alertmanager:v0.28.1@sha256:27c475db5fb156cab31d5c18a4251ac7ed567746a2483ff264516437a39b15ba}
    profiles: ["monitoring"]
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./deploy/monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    ports:
      - "127.0.0.1:${ALERTMANAGER_HOST_PORT:-19093}:9093"
    depends_on:
      - monitoring-webhook
    networks:
      - monitoring

  prometheus:
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:v3.5.0@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996}
    profiles: ["monitoring"]
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME:-15d}
      - --web.enable-lifecycle
    volumes:
      - ./deploy/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/monitoring/alerts:/etc/prometheus/alerts:ro
      - prometheus_data:/prometheus
    secrets:
      - moonbook_metrics_token
    ports:
      - "127.0.0.1:${PROMETHEUS_HOST_PORT:-19090}:9090"
    depends_on:
      - alertmanager
      - postgres-exporter
      - redis-exporter
      - blackbox-exporter
      - cadvisor
    networks:
      - backend
      - monitoring

networks:
  backend:
    name: ${COMPOSE_PROJECT_NAME:-moonbook}_backend
  frontend:
    name: ${COMPOSE_PROJECT_NAME:-moonbook}_frontend
  monitoring:
    name: ${COMPOSE_PROJECT_NAME:-moonbook}_monitoring

volumes:
  postgres_data:
    name: ${COMPOSE_PROJECT_NAME:-moonbook}_postgres_data
  redis_data:
    name: ${COMPOSE_PROJECT_NAME:-moonbook}_redis_data
  minio_data:
    name: ${COMPOSE_PROJECT_NAME:-moonbook}_minio_data
  prometheus_data:
    name: ${COMPOSE_PROJECT_NAME:-moonbook}_prometheus_data
  alertmanager_data:
    name: ${COMPOSE_PROJECT_NAME:-moonbook}_alertmanager_data

secrets:
  moonbook_metrics_token:
    file: ${MOONBOOK_METRICS_TOKEN_FILE:-./.local/moonbook-metrics-token}
