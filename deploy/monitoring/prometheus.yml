global:
  scrape_interval: 15s
  evaluation_interval: 5s
  external_labels:
    service: moonbook

rule_files:
  - /etc/prometheus/alerts/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  - job_name: moonbook-server
    authorization:
      type: Bearer
      credentials_file: /run/secrets/moonbook_metrics_token
    static_configs:
      - targets: [server:8888]
    metrics_path: /metrics

  - job_name: postgres
    static_configs:
      - targets: [postgres-exporter:9187]

  - job_name: redis
    static_configs:
      - targets: [redis-exporter:9121]

  - job_name: minio
    metrics_path: /minio/v2/metrics/cluster
    static_configs:
      - targets: [minio:9000]

  - job_name: cadvisor
    static_configs:
      - targets: [cadvisor:8080]

  - job_name: blackbox
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://gateway:8080/gateway-health
          - http://reader-ui:3000/health
          - http://server:8888/health/ready
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
